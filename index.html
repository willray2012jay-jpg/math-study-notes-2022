<!DOCTYPE html>
<html>
<head>
    <title>My Math Class Assignment Hub</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; font-family: sans-serif; background: #111; color: white; }
        .navbar { display: flex; background: #1a1a1a; padding: 12px; gap: 10px; justify-content: center; overflow-x: auto; white-space: nowrap; border-bottom: 2px solid #333; }
        .nav-btn { background: #333; color: white; border: none; padding: 10px 18px; cursor: pointer; border-radius: 6px; font-weight: bold; font-size: 14px; transition: 0.2s; }
        .nav-btn:hover { background: #555; transform: scale(1.05); }
        .roblox-btn { background: #d32f2f; } /* Dark Red for Roblox */
        .roblox-btn:hover { background: #f44336; }
        .container { height: calc(100% - 60px); width: 100%; background: #000; }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

    <!-- Game Changer Row at the top of your iPad screen -->
    <div class="navbar">
        <button class="nav-btn roblox-btn" onclick="playGame('https://cloudmoonapp.com')">🎮 ROBLOX (Main Server)</button>
        <button class="nav-btn roblox-btn" onclick="playGame('https://easyfun.gg')">🎮 ROBLOX (Backup Server)</button>
        <button class="nav-btn" onclick="playGame('https://googleusercontent.com')">🏈 Retro Bowl</button>
        <button class="nav-btn" onclick="playGame('https://github.io')">🏃 Subway Surfers</button>
        <button class="nav-btn" onclick="playGame('https://github.io')">🟢 Slope Game</button>
        <button class="nav-btn" onclick="playGame('https://github.io')">🍄 Mario 64</button>
    </div>

    <!-- The Screen Window where games load -->
    <div class="container">
        <!-- It will boot directly into Roblox when you open the site -->
        <iframe id="game-screen" src="https://cloudmoonapp.com"></iframe>
    </div>

    <script>
        function playGame(url) {
            document.getElementById('game-screen').src = url;
        }
    </script>

</body>
</html>
